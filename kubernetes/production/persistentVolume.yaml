apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: wanderlust-ebs
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
parameters:
  type: gp3
  csi.storage.k8s.io/fstype: ext4
  encrypted: "false"
