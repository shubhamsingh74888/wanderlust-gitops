apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
  namespace: wanderlust
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp2        # ← was wanderlust-ebs (does not exist); gp2 is EKS default
  resources:
    requests:
      storage: 5Gi
